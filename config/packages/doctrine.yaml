doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        # server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        types:
            aggregate_root_id: App\Shared\Infrastructure\Persistence\Doctrine\Type\AggregateRootIdType
            required_name: App\Shared\Infrastructure\Persistence\Doctrine\Type\RequiredNameType
            ingredient_type_reference:  App\Ingredient\Infrastructure\Doctrine\Type\IngredientTypeReferenceType
            unit_of_measure_symbol: App\UnitOfMeasure\Infrastructure\Doctrine\Type\UnitOfMeasureSymbolType
            recipe_servings: App\Recipe\Infrastructure\Doctrine\Type\RecipeServingsType
            recipe_rating: App\Recipe\Infrastructure\Doctrine\Type\RecipeRatingType
            ordering: App\Shared\Infrastructure\Persistence\Doctrine\Type\OrderingType
            recipe_ingredient_quantity: App\Recipe\Infrastructure\Doctrine\Type\RecipeIngredientQuantityType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            EntityTypeXML:
                type: xml
                dir: '%kernel.project_dir%/src/IngredientType/Infrastructure/DoctrineMapping'
                prefix: 'App\IngredientType\Domain\Model'
                alias: IngredientType
                is_bundle: false
            SeasonXML:
                type: xml
                dir: '%kernel.project_dir%/src/Season/Infrastructure/DoctrineMapping'
                prefix: 'App\Season\Domain\Model'
                alias: Season
                is_bundle: false
            UnitOfMeasureXML:
                type: xml
                dir: '%kernel.project_dir%/src/UnitOfMeasure/Infrastructure/DoctrineMapping'
                prefix: 'App\UnitOfMeasure\Domain\Model'
                alias: UnitOfMeasure
                is_bundle: false
            IngredientXML:
                type: xml
                dir: '%kernel.project_dir%/src/Ingredient/Infrastructure/DoctrineMapping'
                prefix: 'App\Ingredient\Domain\Model'
                alias: Ingredient
                is_bundle: false
            MediaXML:
                type: xml
                dir: '%kernel.project_dir%/src/Media/Infrastructure/DoctrineMapping'
                prefix: 'App\Media\Domain\Model'
                alias: Media
                is_bundle: false
            MealCourseXml:
                type: xml
                dir: '%kernel.project_dir%/src/MealCourse/Infrastructure/DoctrineMapping'
                prefix: 'App\MealCourse\Domain\Model'
                alias: MealCourse
                is_bundle: false
            RecipeXml:
                type: xml
                dir: '%kernel.project_dir%/src/Recipe/Infrastructure/DoctrineMapping'
                prefix: 'App\Recipe\Domain\Model'
                alias: Recipe
                is_bundle: false
when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
